# MongoDB host port 27020 -> Docker container port 27017.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27020/teamsprojects}

# Redis host port 6378 -> Docker container port 6379.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6378}
spring.cache.type=redis

# Users-Skills synchronous client.
clients.users-skills.url=${USERS_SKILLS_URL:http://localhost:8350}
clients.users-skills.engineers-path=/api/users/engineers
clients.users-skills.engineers-by-ids-path=/api/users/engineers/by-ids

# Cache TTLs are configured in RedisCacheConfig.
