# Merge these properties into your existing application.properties.
# Redis cache-aside setup
spring.data.redis.host=localhost
spring.data.redis.port=6378
spring.cache.type=redis

# Users-Skills synchronous client - replace with actual service host and paths.
clients.users-skills.url=http://localhost:8081
clients.users-skills.engineers-path=/api/users/engineers
clients.users-skills.engineers-by-ids-path=/api/users/engineers/by-ids

# Cache TTLs are configured in RedisCacheConfig.
