spring.application.name=management
server.port=${SERVER_PORT:8360}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/pm-rag}
clients.users-skills.url=${USERS_SKILLS_URL:http://localhost:8350}

# Infrastructure from docker-compose.yaml (MongoDB host port 27020 -> container port 27017).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27020/teamsprojects}

# Redis host port 6378 -> container port 6379.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6378}
spring.cache.type=redis
