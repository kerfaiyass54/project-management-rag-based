# Infrastructure only: the Spring Boot services, assistants, gateway and React
# app run outside Docker (IDE / terminal) and connect to these ports.
#
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete all data)
#
# Linux / WSL2 only, needed once for Elasticsearch:
#   sudo sysctl -w vm.max_map_count=262144

services:
  postgres:            # Service 1 database
    image: postgres:16-alpine
    ports:
      - "5450:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:             # PostgreSQL UI at http://localhost:5050
    image: dpage/pgadmin4:8
    ports:
      - "5058:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

  mongodb:             # Service 3 database
    image: mongo:7
    ports:
      - "27020:27017"
    volumes:
      - mongo-data:/data/db

  elasticsearch-users: # Service 1: search, RAG vectors, conversations
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    ports:
      - "9203:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-users-data:/usr/share/elasticsearch/data

  elasticsearch-teams: # Service 3: search, RAG vectors, conversations
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    ports:
      - "9202:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-teams-data:/usr/share/elasticsearch/data

  redis:               # cache for both services
    image: redis:7-alpine
    ports:
      - "6378:6379"

  keycloak:            # authentication, admin console at http://localhost:8180
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    ports:
      - "8181:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  postgres-data:
  pgadmin-data:
  mongo-data:
  es-users-data:
  es-teams-data:
  keycloak-data: